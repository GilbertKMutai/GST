<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gilbert Specialists Tech — .NET, Blazor &amp; Cloud Engineering</title>
    <meta name="description" content="A boutique .NET, Blazor, and cloud engineering consultancy based in Nairobi, building reliable software for teams in the US, Europe, and beyond." />
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/webp" href="favicon.webp" />
    <link href="GST.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.webp" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.webp" />
    <script type="importmap"></script>
</head>

<body>
    <!-- Blazor app root -->
    <div id="app">
        <!-- Loading splash shown before WASM boots -->
        <div style="display:flex;height:100vh;align-items:center;justify-content:center;background:#ffffff;">
            <div style="font-family:'Inter',sans-serif;font-size:0.85rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#93969E;">
                Loading…
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
    <script src="js/app.js"></script>
</body>

</html>
