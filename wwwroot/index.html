<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gilbert Specialists Tech — .NET &amp; Cloud Engineering</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
      <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="GST.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
</head>

<body>
  <!-- Custom cursor (rendered globally, outside Blazor component tree) -->
    <div id="cursor"></div>
    <div id="cursor-ring"></div>

    <!-- Blazor app root -->
    <div id="app">
        <!-- Loading splash shown before WASM boots -->
        <div style="display:flex;height:100vh;align-items:center;justify-content:center;background:blue;">
            <div style="font-family:'Bebas Neue',cursive;font-size:1.6rem;letter-spacing:.1em;color:#FF4D00;">
                LOADING…
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
    <script src="js/app.js"></script>
</body>

</html>
